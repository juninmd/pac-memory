name: Publish IA Know Papers

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DB_PATH: data/pac-memory.db
      LLM_PROVIDER: ollama
      PAPER_AGGREGATOR_ENABLED: "true"
      PAPER_AGGREGATOR_MAX_ITEMS: "100"
      IA_KNOW_REPO_URL: https://github.com/juninmd/ia-know.git
      IA_KNOW_REPO_PATH: temp/ia-know
      IA_KNOW_AUTO_PUSH: "true"
      GITHUB_TOKEN: ${{ secrets.IA_KNOW_PUSH_TOKEN }}

    steps:
      - name: Checkout pac-memory
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect latest AI/LLM papers
        run: pnpm tsx src/cli/index.ts papers

      - name: Publish IA Know generated dataset
        run: pnpm tsx src/cli/index.ts publish-ia-know
